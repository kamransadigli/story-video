<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920">
  <rect width="1080" height="1920" fill="#e8c79a"/>
  <text x="540" y="100" text-anchor="middle" font-family="Oswald" font-weight="700" font-size="64" fill="#15141f">THE DETECTIVE DID IT</text>
  <text x="540" y="150" text-anchor="middle" font-family="Oswald" font-size="34" fill="#5a3a20">Character sheet · keep identical in every episode</text>
  <rect x="40" y="190" width="1000" height="540" rx="30" fill="#fbf3e2" stroke="#15141f" stroke-width="5"/>
  <svg x="60" y="210" width="360" height="500" viewBox="0 0 600 760" preserveAspectRatio="xMidYMin slice"><use href="#detective" width="600" height="760"/></svg>
  <rect x="60" y="210" width="360" height="500" fill="none" stroke="#15141f" stroke-width="3"/>
  <text x="440" y="265" font-family="Oswald" font-weight="700" font-size="56" fill="#c8102e">THE DETECTIVE (me)</text><text x="440" y="310" font-family="Oswald" font-size="34" fill="#2b2a33">40s, narrator, first person</text><text x="440" y="354" font-family="Oswald" font-size="34" fill="#2b2a33">Tired eyes, eye bags, stubble</text><text x="440" y="398" font-family="Oswald" font-size="34" fill="#2b2a33">Grey suit, white shirt</text><text x="440" y="442" font-family="Oswald" font-size="34" fill="#2b2a33">Loosened dark-red tie, grey temples</text><rect x="440" y="490" width="56" height="56" rx="10" fill="#6e737c" stroke="#15141f" stroke-width="3"/><rect x="510" y="490" width="56" height="56" rx="10" fill="#b0102a" stroke="#15141f" stroke-width="3"/><rect x="580" y="490" width="56" height="56" rx="10" fill="#d6a07a" stroke="#15141f" stroke-width="3"/><rect x="650" y="490" width="56" height="56" rx="10" fill="#2c2420" stroke="#15141f" stroke-width="3"/>
  <rect x="40" y="760" width="1000" height="540" rx="30" fill="#fbf3e2" stroke="#15141f" stroke-width="5"/>
  <svg x="60" y="780" width="360" height="500" viewBox="0 0 600 760" preserveAspectRatio="xMidYMin slice"><use href="#mia" width="600" height="760"/></svg>
  <rect x="60" y="780" width="360" height="500" fill="none" stroke="#15141f" stroke-width="3"/>
  <text x="440" y="835" font-family="Oswald" font-weight="700" font-size="56" fill="#c8102e">MIA</text><text x="440" y="880" font-family="Oswald" font-size="34" fill="#2b2a33">Young rookie partner</text><text x="440" y="924" font-family="Oswald" font-size="34" fill="#2b2a33">Sharp green eyes, black ponytail</text><text x="440" y="968" font-family="Oswald" font-size="34" fill="#2b2a33">RED scarf + red hair tie</text><text x="440" y="1012" font-family="Oswald" font-size="34" fill="#2b2a33">Beige trench coat, notebook</text><rect x="440" y="1060" width="56" height="56" rx="10" fill="#d0142f" stroke="#15141f" stroke-width="3"/><rect x="510" y="1060" width="56" height="56" rx="10" fill="#c9a676" stroke="#15141f" stroke-width="3"/><rect x="580" y="1060" width="56" height="56" rx="10" fill="#e0b08a" stroke="#15141f" stroke-width="3"/><rect x="650" y="1060" width="56" height="56" rx="10" fill="#1a1416" stroke="#15141f" stroke-width="3"/>
  <rect x="40" y="1330" width="1000" height="540" rx="30" fill="#fbf3e2" stroke="#15141f" stroke-width="5"/>
  <svg x="60" y="1350" width="360" height="500" viewBox="0 0 600 760" preserveAspectRatio="xMidYMin slice"><use href="#sal" width="600" height="760"/></svg>
  <rect x="60" y="1350" width="360" height="500" fill="none" stroke="#15141f" stroke-width="3"/>
  <text x="440" y="1405" font-family="Oswald" font-weight="700" font-size="56" fill="#c8102e">SAL (bartender)</text><text x="440" y="1450" font-family="Oswald" font-size="34" fill="#2b2a33">Big guy, innocent</text><text x="440" y="1494" font-family="Oswald" font-size="34" fill="#2b2a33">Thick mustache, balding</text><text x="440" y="1538" font-family="Oswald" font-size="34" fill="#2b2a33">White apron</text><text x="440" y="1582" font-family="Oswald" font-size="34" fill="#2b2a33">Blue-white striped shirt</text><rect x="440" y="1630" width="56" height="56" rx="10" fill="#f4f1ea" stroke="#15141f" stroke-width="3"/><rect x="510" y="1630" width="56" height="56" rx="10" fill="#3d6b8c" stroke="#15141f" stroke-width="3"/><rect x="580" y="1630" width="56" height="56" rx="10" fill="#e8b494" stroke="#15141f" stroke-width="3"/><rect x="650" y="1630" width="56" height="56" rx="10" fill="#4a2a1a" stroke="#15141f" stroke-width="3"/>
</svg>
