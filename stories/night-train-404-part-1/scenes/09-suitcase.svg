<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920">
  <rect width="1080" height="1920" fill="#0d0a08"/>
  <!-- aisle floor in perspective -->
  <path d="M-200 1920 L1280 1920 L720 820 L360 820 Z" fill="#2e1d14"/>
  <path d="M360 820 L720 820 L760 700 L320 700 Z" fill="#160f0a"/>
  <!-- seats both sides -->
  <g fill="#4f1420" class="thin">
    <path d="M0 700 L240 760 L220 1300 L0 1500 Z"/><path d="M1080 700 L840 760 L860 1300 L1080 1500 Z"/>
    <path d="M250 760 L330 780 L320 1060 L230 1150 Z"/><path d="M830 760 L750 780 L760 1060 L850 1150 Z"/>
  </g>
  <!-- flashlight beam -->
  <path d="M1080 200 L1080 420 L700 1500 L300 1380 Z" fill="url(#beam)" opacity="0.6"/>
  <ellipse cx="520" cy="1450" rx="380" ry="170" fill="url(#spot)"/>
  <!-- suitcase -->
  <g transform="translate(300 1180)" filter="url(#shadow)">
    <ellipse cx="230" cy="420" rx="300" ry="40" fill="#000" opacity="0.6"/>
    <rect x="140" y="-70" width="180" height="90" rx="34" fill="none" stroke="#3b2414" stroke-width="24"/>
    <rect width="460" height="420" rx="30" fill="#8a5530" class="ink"/>
    <rect x="90" y="0" width="44" height="420" fill="#5e3820"/><rect x="326" y="0" width="44" height="420" fill="#5e3820"/>
    <rect x="200" y="60" width="60" height="44" rx="6" fill="#d9b24a" class="thin"/>
    <g fill="#d9b24a"><circle cx="20" cy="20" r="10"/><circle cx="440" cy="20" r="10"/><circle cx="20" cy="400" r="10"/><circle cx="440" cy="400" r="10"/></g>
    <rect x="150" y="200" width="160" height="110" rx="8" fill="#f3e6c8" class="thin" transform="rotate(-4 230 255)"/>
    <text x="230" y="265" text-anchor="middle" font-family="Typewriter" font-size="34" fill="#15141f" transform="rotate(-4 230 255)">C. WEISS</text>
  </g>
  <rect width="1080" height="1920" filter="url(#grit)"/>
</svg>
