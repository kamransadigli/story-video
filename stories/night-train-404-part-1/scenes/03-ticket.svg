<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920">
  <rect width="1080" height="1920" fill="url(#wood)"/>
  <g stroke="#3e2512" stroke-width="5" opacity="0.5" fill="none"><path d="M0 400 C300 390 700 420 1080 400"/><path d="M0 900 C400 880 600 920 1080 905"/><path d="M0 1500 C300 1490 800 1520 1080 1505"/></g>
  <ellipse cx="540" cy="900" rx="700" ry="760" fill="url(#lamp)" opacity="0.55"/>
  <!-- ticket -->
  <g transform="rotate(-6 540 760)" filter="url(#shadow)">
    <rect x="140" y="420" width="800" height="560" rx="18" fill="#f3e6c8" class="ink"/>
    <rect x="140" y="420" width="800" height="110" rx="18" fill="#1f3d55"/>
    <rect x="140" y="500" width="800" height="30" fill="#1f3d55"/>
    <text x="540" y="498" text-anchor="middle" font-family="Oswald" font-weight="700" font-size="58" fill="#ffd58a" letter-spacing="6">NIGHT TRAIN 404</text>
    <g class="type" font-size="40">
      <text x="200" y="620">PASSENGER</text><text x="560" y="620" fill="#15141f">C. WEISS</text>
      <text x="200" y="700">DEPARTS</text><text x="560" y="700" fill="#15141f">23:40</text>
      <text x="200" y="780">CARRIAGE</text><text x="560" y="780" fill="#15141f">3</text>
    </g>
    <rect x="200" y="820" width="680" height="4" fill="#15141f" stroke-dasharray="10 8"/>
    <text x="200" y="930" font-family="Oswald" font-weight="700" font-size="96" fill="#c8102e">SEAT 15</text>
    <circle cx="830" cy="890" r="50" fill="none" stroke="#2a5c8c" stroke-width="6" opacity="0.6"/>
  </g>
  <!-- pocket watch -->
  <g transform="translate(560 1360)" filter="url(#shadow)">
    <path d="M0 -300 C-40 -360 -10 -420 40 -440" fill="none" stroke="#c9a24a" stroke-width="12"/>
    <circle cx="0" cy="-270" r="30" fill="none" stroke="#c9a24a" stroke-width="14"/>
    <circle r="250" fill="#c9a24a" class="ink"/>
    <circle r="215" fill="#f6f1e2" class="thin"/>
    <g stroke="#15141f" stroke-width="6" stroke-linecap="round">
      <line x1="0" y1="-195" x2="0" y2="-170"/><line x1="0" y1="195" x2="0" y2="170"/><line x1="-195" y1="0" x2="-170" y2="0"/><line x1="195" y1="0" x2="170" y2="0"/>
      <line x1="97" y1="-169" x2="85" y2="-147"/><line x1="169" y1="-97" x2="147" y2="-85"/><line x1="169" y1="97" x2="147" y2="85"/><line x1="97" y1="169" x2="85" y2="147"/>
      <line x1="-97" y1="169" x2="-85" y2="147"/><line x1="-169" y1="97" x2="-147" y2="85"/><line x1="-169" y1="-97" x2="-147" y2="-85"/><line x1="-97" y1="-169" x2="-85" y2="-147"/>
    </g>
    <!-- 23:40 → hour hand near 11.67, minute hand at 8 -->
    <line x1="0" y1="0" x2="-48" y2="-100" stroke="#15141f" stroke-width="14" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="-150" y2="-87" stroke="#15141f" stroke-width="9" stroke-linecap="round"/>
    <circle r="14" fill="#c8102e"/>
  </g>
  <rect width="1080" height="1920" filter="url(#grit)"/>
</svg>
