<defs>
  <style>
    .ink{stroke:#15141f;stroke-width:5;stroke-linejoin:round;stroke-linecap:round}
    .thin{stroke:#15141f;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
    .marker{font-family:Marker;fill:#15141f}
    .type{font-family:Typewriter;fill:#2b2a33}
    .head{font-family:Oswald;font-weight:700;fill:#15141f}
  </style>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#000" flood-opacity="0.5"/>
  </filter>
  <filter id="shadowSm" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000" flood-opacity="0.45"/>
  </filter>
  <filter id="blur"><feGaussianBlur stdDeviation="40"/></filter>
  <filter id="blurSm"><feGaussianBlur stdDeviation="10"/></filter>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="16" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="grit" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="7"/>
    <feColorMatrix values="0 0 0 0 0.08  0 0 0 0 0.06  0 0 0 0 0.04  0 0 0 0.16 0"/>
  </filter>
  <filter id="static" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="1.6" numOctaves="1" seed="11"/>
    <feColorMatrix values="0 0 0 0 0.75  0 0 0 0 0.85  0 0 0 0 0.85  0 0 0 0.9 -0.25"/>
  </filter>

  <linearGradient id="wallTeal" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#16303a"/><stop offset="1" stop-color="#0b161d"/>
  </linearGradient>
  <linearGradient id="night" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#07111c"/><stop offset="1" stop-color="#1d4a5c"/>
  </linearGradient>
  <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#f6ecd4"/><stop offset="1" stop-color="#ddc99f"/>
  </linearGradient>
  <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#8a5a33"/><stop offset="1" stop-color="#4e2f18"/>
  </linearGradient>
  <linearGradient id="desk" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#5b4a3c"/><stop offset="1" stop-color="#2a211a"/>
  </linearGradient>
  <radialGradient id="lamp">
    <stop offset="0" stop-color="#ffd58a" stop-opacity="0.75"/>
    <stop offset="0.5" stop-color="#f2a541" stop-opacity="0.25"/>
    <stop offset="1" stop-color="#f2a541" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="moonGlow">
    <stop offset="0" stop-color="#e8f6ff" stop-opacity="0.9"/>
    <stop offset="1" stop-color="#8fd3ff" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="spot">
    <stop offset="0" stop-color="#fff6dc" stop-opacity="0.6"/>
    <stop offset="1" stop-color="#fff6dc" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="redGlow">
    <stop offset="0" stop-color="#ff3344" stop-opacity="0.75"/>
    <stop offset="1" stop-color="#ff3344" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="blueGlow">
    <stop offset="0" stop-color="#3d8bff" stop-opacity="0.8"/>
    <stop offset="1" stop-color="#3d8bff" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fff3c4" stop-opacity="0.55"/>
    <stop offset="1" stop-color="#fff3c4" stop-opacity="0"/>
  </linearGradient>

  <pattern id="cork" width="36" height="36" patternUnits="userSpaceOnUse">
    <rect width="36" height="36" fill="#b07c50"/>
    <circle cx="6" cy="8" r="2.2" fill="#8d5f3a"/><circle cx="24" cy="5" r="1.6" fill="#c99467"/>
    <circle cx="17" cy="20" r="2.4" fill="#93643e"/><circle cx="31" cy="27" r="1.8" fill="#8a5c37"/>
    <circle cx="8" cy="30" r="1.5" fill="#c99467"/>
  </pattern>
  <pattern id="tiles" width="120" height="90" patternUnits="userSpaceOnUse">
    <rect width="120" height="90" fill="#1d4b56"/>
    <rect x="4" y="4" width="112" height="82" rx="8" fill="#246070"/>
  </pattern>
  <pattern id="lines" width="10" height="34" patternUnits="userSpaceOnUse">
    <rect width="10" height="14" y="10" fill="#b7aa8e"/>
  </pattern>

  <symbol id="pin" viewBox="0 0 40 46" overflow="visible">
    <ellipse cx="24" cy="40" rx="10" ry="4" fill="#000" opacity="0.35"/>
    <path d="M20 22 L23 40" stroke="#9aa0a6" stroke-width="3"/>
    <circle cx="20" cy="16" r="13" fill="#c8102e" stroke="#15141f" stroke-width="3"/>
    <circle cx="15" cy="11" r="4" fill="#ff8a8a"/>
  </symbol>
  <symbol id="mug" viewBox="0 0 300 380" overflow="visible">
    <rect x="0" y="0" width="300" height="380" fill="#d9d2c0" stroke="#15141f" stroke-width="5"/>
    <rect x="16" y="16" width="268" height="300" fill="#a9a395"/>
    <path d="M60 316 C60 230 100 205 150 205 C200 205 240 230 240 316 Z" fill="#2b2833"/>
    <path d="M150 60 C95 60 72 105 75 160 C78 205 70 240 55 270 L245 270 C230 240 222 205 225 160 C228 105 205 60 150 60 Z" fill="#2b2833"/>
    <text x="150" y="215" text-anchor="middle" font-family="Oswald" font-weight="700" font-size="170" fill="#e02035">?</text>
    <text x="150" y="358" text-anchor="middle" font-family="Typewriter" font-size="30" fill="#15141f">UNKNOWN FEMALE</text>
  </symbol>
  <symbol id="mugMale" viewBox="0 0 300 380" overflow="visible">
    <rect x="0" y="0" width="300" height="380" fill="#d9d2c0" stroke="#15141f" stroke-width="5"/>
    <rect x="16" y="16" width="268" height="300" fill="#9fa7a8"/>
    <path d="M45 316 C45 225 95 200 150 200 C205 200 255 225 255 316 Z" fill="#2b2833"/>
    <ellipse cx="150" cy="140" rx="62" ry="74" fill="#2b2833"/>
    <text x="150" y="200" text-anchor="middle" font-family="Oswald" font-weight="700" font-size="150" fill="#e02035">?</text>
    <text x="150" y="358" text-anchor="middle" font-family="Typewriter" font-size="30" fill="#15141f">MALE, DECEASED</text>
  </symbol>
</defs>
