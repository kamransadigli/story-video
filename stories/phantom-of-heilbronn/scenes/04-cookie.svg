<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920">
  <rect width="1080" height="1920" fill="#0d1a20"/>
  <!-- trailer wall + window -->
  <rect x="0" y="0" width="1080" height="820" fill="#3a5a52"/>
  <g stroke="#2a443e" stroke-width="6"><line x1="0" y1="120" x2="1080" y2="120"/><line x1="0" y1="260" x2="1080" y2="260"/><line x1="0" y1="400" x2="1080" y2="400"/><line x1="0" y1="540" x2="1080" y2="540"/><line x1="0" y1="680" x2="1080" y2="680"/></g>
  <g filter="url(#shadow)"><rect x="560" y="140" width="420" height="320" rx="60" fill="#e8dcc0" class="ink"/><rect x="590" y="170" width="360" height="260" rx="44" fill="url(#night)"/>
    <circle cx="860" cy="250" r="40" fill="#f1f8ff" opacity="0.9"/></g>
  <!-- table -->
  <path d="M-40 820 L1120 820 L1120 1920 L-40 1920 Z" fill="url(#wood)"/>
  <rect x="-40" y="808" width="1160" height="26" fill="#a87447" class="ink"/>
  <g stroke="#3e2512" stroke-width="4" opacity="0.6" fill="none"><path d="M0 1000 C300 990 700 1020 1080 1000"/><path d="M0 1250 C400 1240 600 1270 1080 1255"/><path d="M0 1520 C300 1510 800 1540 1080 1525"/></g>
  <!-- flashlight spot -->
  <ellipse cx="520" cy="1260" rx="520" ry="380" fill="url(#spot)"/>
  <!-- plate -->
  <ellipse cx="500" cy="1300" rx="380" ry="170" fill="#000" opacity="0.35" filter="url(#blurSm)"/>
  <ellipse cx="500" cy="1270" rx="380" ry="170" fill="#eef1f1" class="ink"/>
  <ellipse cx="500" cy="1262" rx="290" ry="122" fill="#dfe4e4"/>
  <!-- half cookie -->
  <g transform="translate(500 1240)" filter="url(#shadow)">
    <path d="M-210 0 C-210 -100 -110 -150 -10 -150 C30 -150 60 -140 80 -128 C40 -100 30 -60 60 -30 C20 -10 20 40 60 60 C30 90 40 120 50 132 C20 140 0 142 -30 142 C-140 142 -210 80 -210 0 Z" fill="#d9a35b" class="ink"/>
    <path d="M-170 -10 C-170 -80 -100 -115 -10 -115" fill="none" stroke="#f0c27d" stroke-width="10" stroke-linecap="round" opacity="0.7"/>
    <g fill="#4a2a17"><ellipse cx="-120" cy="-40" rx="22" ry="16"/><ellipse cx="-40" cy="-90" rx="18" ry="14"/><ellipse cx="-90" cy="60" rx="20" ry="15"/><ellipse cx="0" cy="70" rx="18" ry="13"/></g>
  </g>
  <g fill="#c58f4c"><circle cx="680" cy="1240" r="8"/><circle cx="700" cy="1290" r="6"/><circle cx="660" cy="1320" r="5"/><circle cx="720" cy="1220" r="4"/></g>
  <!-- evidence marker -->
  <g transform="translate(700 1380)" filter="url(#shadow)">
    <path d="M0 220 L40 0 L230 0 L270 220 Z" fill="#f2d21b" class="ink"/>
    <path d="M40 0 L230 0 L210 -20 L60 -20 Z" fill="#d8b80f" class="thin"/>
    <text x="135" y="160" text-anchor="middle" font-family="Oswald" font-weight="700" font-size="150" fill="#15141f">17</text>
  </g>
  <rect width="1080" height="1920" filter="url(#grit)"/>
