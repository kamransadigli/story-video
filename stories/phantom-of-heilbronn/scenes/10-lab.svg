    <path d="M760 1920 C740 1750 680 1600 610 1480 C590 1450 610 1420 640 1430 C670 1440 700 1490 720 1530 L700 1380 C695 1345 735 1335 745 1370 L770 1500 L770 1350 C770 1315 810 1315 812 1350 L820 1500 L840 1370 C845 1338 885 1342 880 1375 L865 1520 L900 1420 C910 1392 948 1402 940 1432 L900 1640 C890 1740 900 1830 920 1920 Z" fill="#3e8fb0" class="ink"/>
