    <path d="M330 1060 L760 1060 L700 900 L390 900 Z" fill="#c99332" class="ink"/>
    <text x="545" y="1210" text-anchor="middle" font-family="Oswald" font-weight="700" font-size="56" fill="#15141f">EVIDENCE KIT</text>
    <g class="thin"><rect x="400" y="980" width="70" height="110" fill="#f4f4ef" transform="rotate(-8 435 1035)"/><rect x="490" y="970" width="70" height="120" fill="#f4f4ef"/><rect x="580" y="985" width="70" height="105" fill="#f4f4ef" transform="rotate(7 615 1037)"/></g>
