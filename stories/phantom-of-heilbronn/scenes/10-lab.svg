  </g>
  <g fill="#7fc9d6" opacity="0.25"><rect x="70" y="150" width="260" height="360"/><rect x="410" y="150" width="260" height="360"/><rect x="750" y="150" width="260" height="360"/></g>
  <g class="thin"><rect x="100" y="380" width="40" height="130" fill="#9fd0c4"/><rect x="160" y="400" width="40" height="110" fill="#d7e7c8"/><rect x="460" y="360" width="60" height="150" fill="#c5e3ef"/><rect x="800" y="390" width="50" height="120" fill="#9fd0c4"/></g>
