<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920">
  <rect width="1080" height="1920" fill="#1a1d22"/>
  <ellipse cx="540" cy="980" rx="720" ry="860" fill="url(#spot)" opacity="0.55"/>
  <g transform="rotate(3 540 960)" filter="url(#shadow)">
    <rect x="110" y="260" width="860" height="1300" fill="#f4f4ef" class="ink"/>
    <rect x="110" y="260" width="860" height="120" fill="#2a5c8c"/>
    <text x="150" y="340" font-family="Oswald" font-weight="700" font-size="60" fill="#fff">DNA ANALYSIS REPORT</text>
    <text x="150" y="450" class="type" font-size="30">SAMPLE: B-2009-0347</text>
    <text x="150" y="500" class="type" font-size="30">SOURCE: MALE BODY</text>
    <text x="150" y="550" class="type" font-size="30">PROFILE: "UNKNOWN FEMALE"</text>
    <g transform="translate(160 620)">
      <g fill="#2a8c5a"><rect x="0" y="80" width="30" height="220"/><rect x="200" y="40" width="30" height="260"/><rect x="400" y="140" width="30" height="160"/><rect x="600" y="20" width="30" height="280"/></g>
      <g fill="#c8102e"><rect x="50" y="160" width="30" height="140"/><rect x="250" y="100" width="30" height="200"/><rect x="450" y="60" width="30" height="240"/><rect x="650" y="190" width="30" height="110"/></g>
      <g fill="#2a5c8c"><rect x="100" y="30" width="30" height="270"/><rect x="300" y="180" width="30" height="120"/><rect x="500" y="110" width="30" height="190"/><rect x="700" y="70" width="30" height="230"/></g>
      <rect x="-10" y="300" width="760" height="4" fill="#15141f"/>
    </g>
    <rect x="150" y="990" width="780" height="520" fill="url(#lines)"/>
  </g>
  <!-- male mugshot paperclipped -->
  <g transform="translate(600 1080) rotate(9)" filter="url(#shadow)"><use href="#mugMale" width="320" height="405"/>
    <path d="M60 -30 L60 70 Q60 90 80 90 Q100 90 100 70 L100 -10" fill="none" stroke="#9aa0a6" stroke-width="8"/></g>
  <!-- MATCH stamp -->
  <g transform="translate(400 1180) rotate(-14)" opacity="0.92">
    <rect x="-300" y="-120" width="600" height="220" rx="20" fill="none" stroke="#d0142f" stroke-width="16"/>
    <text x="0" y="55" text-anchor="middle" font-family="Oswald" font-weight="700" font-size="170" fill="#d0142f" letter-spacing="10">MATCH</text>
  </g>
  <!-- sticky -->
  <g transform="translate(120 1600) rotate(-7)" filter="url(#shadow)"><rect width="380" height="200" fill="#f7d94c" class="thin"/>
    <text x="190" y="88" text-anchor="middle" class="marker" font-size="46">A MAN?!</text>
    <text x="190" y="150" text-anchor="middle" class="marker" font-size="40" fill="#c8102e">IMPOSSIBLE</text></g>
  <rect width="1080" height="1920" filter="url(#grit)"/>
</svg>
