<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920">
  <rect width="1080" height="1920" fill="url(#panel)"/>
  <rect x="0" y="0" width="1080" height="150" fill="#24150b"/>
  <g fill="#ffe2a6" filter="url(#glow)"><rect x="180" y="120" width="140" height="16" rx="8"/><rect x="760" y="120" width="140" height="16" rx="8"/></g>
  <!-- window onto the frozen station -->
  <rect x="160" y="300" width="760" height="760" rx="44" fill="#c9a24a" stroke="#15141f" stroke-width="6"/>
  <rect x="190" y="330" width="700" height="700" rx="30" fill="#0f2238"/>
  <rect x="190" y="330" width="700" height="460" rx="30" fill="#18324e"/>
  <!-- station: platform, lamp post, sign, snow on the ground -->
  <rect x="190" y="800" width="700" height="230" fill="#e8f0f6"/>
  <path d="M190 800 L890 800 L890 830 L190 830 Z" fill="#c4d2dc"/>
  <rect x="300" y="470" width="16" height="330" fill="#2a2a30"/>
  <circle cx="308" cy="470" r="70" fill="#ffd58a" opacity="0.35" filter="url(#blurSm)"/>
  <path d="M282 450 L334 450 L326 480 L290 480 Z" fill="#ffd58a" stroke="#15141f" stroke-width="3"/>
  <path d="M276 446 C290 432 326 432 340 446" fill="#ffffff"/>
  <rect x="520" y="560" width="300" height="80" rx="6" fill="#1f4a7a" stroke="#15141f" stroke-width="4"/>
  <path d="M520 556 C580 540 760 540 820 556 L820 566 L520 566 Z" fill="#ffffff"/>
  <text x="670" y="616" text-anchor="middle" font-family="Oswald" font-weight="700" font-size="44" fill="#ffffff" letter-spacing="4">FROSTWALD</text>
  <rect x="560" y="640" width="12" height="160" fill="#2a2a30"/><rect x="770" y="640" width="12" height="160" fill="#2a2a30"/>
  <g fill="#ffffff"><ellipse cx="420" cy="804" rx="90" ry="16"/><ellipse cx="700" cy="806" rx="120" ry="18"/></g>
  <!-- frost creeping in from the edges -->
  <rect x="190" y="330" width="700" height="700" rx="30" fill="url(#frostEdge)"/>
  <g stroke="#ffffff" stroke-width="3" opacity="0.7" fill="none">
    <path d="M200 360 l40 30 l-10 30 m10 -30 l40 -6"/><path d="M880 360 l-40 34 l8 30 m-8 -30 l-40 -4"/>
    <path d="M200 1010 l46 -30 l-6 -34 m6 34 l40 6"/><path d="M880 1010 l-46 -28 l6 -34 m-6 34 l-40 8"/>
  </g>
  <rect x="530" y="330" width="20" height="700" fill="#c9a24a"/>
  <!-- warm interior: seat backs, heater, lamp -->
  <path d="M-40 1220 C-40 1150 0 1130 80 1130 L1000 1130 C1080 1130 1120 1150 1120 1220 L1120 1920 L-40 1920 Z" fill="url(#velvet)" stroke="#15141f" stroke-width="6"/>
  <use href="#heater" x="80" y="1260" width="330" height="220"/>
  <use href="#tlamp" x="780" y="1060" width="120" height="200"/>
  <ellipse cx="540" cy="1300" rx="640" ry="520" fill="url(#lamp)" opacity="0.5"/>
  <rect width="1080" height="1920" filter="url(#grit)"/>
</svg>
